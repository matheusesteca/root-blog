<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contatos — Root</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="contatos">
    <header>
      <div class="header-content">
        <a class="logo" href="index.html">Root: Crônicas da Floresta</a
        ><button
          class="menu-button"
          type="button"
          aria-expanded="false"
          aria-controls="main-navigation"
          aria-label="Abrir menu"
        >
          <span aria-hidden="true">&#9776;</span>
        </button>
        <nav id="main-navigation" aria-label="Navegação principal">
          <a href="index.html" data-page="home">Home</a
          ><a href="expansoes.html" data-page="expansoes">Expansões</a
          ><a href="faccoes.html" data-page="faccoes">Como jogar</a
          ><a href="tokens.html" data-page="tokens">Tokens</a
          ><a href="contatos.html" data-page="contatos">Contatos</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="page-title">
        <h1>Contatos</h1>
        <p>Use o formulário abaixo para enviar uma sugestão sobre o blog.</p>
      </section>
      <form class="form-box" id="contact-form">
        <label for="nome">Nome</label><input id="nome" required /><label
          for="email"
          >E-mail</label
        ><input id="email" type="email" required /><label for="mensagem"
          >Mensagem</label
        ><textarea id="mensagem" required></textarea
        ><button class="button" type="submit">Enviar</button>
        <p class="feedback" id="feedback"></p>
      </form>
    </main>
    <footer>© <span data-year></span> Crônicas da Floresta</footer>
    <script src="script.js"></script>
  </body>
</html>
